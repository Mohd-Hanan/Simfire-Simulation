defaults:
  - train
  - _self_

cli:
  mode: eval

algo:
  checkpoint_path: ../simharness_data/simharness/experiments/2026-09-20_21-00-23/checkpoints/checkpoint_95
  callbacks:
    - _target_: hydra.utils.get_class
      path: simharness2.callbacks.RenderEnv

# Force it to run locally without spawning extra heavy background workers
rollouts:
  num_rollout_workers: 0
  num_envs_per_worker: 1
  compress_observations: true
evaluation:
  evaluation_num_workers: 0
